function projectIcon(p, size = 'h-12 w-12', radius = 'rounded-[14px]') {
  if (p.icon) return `<img src="${p.icon}" alt="" class="${size} ${radius} object-contain bg-white/[.03] p-1 border hairline" loading="lazy">`;
  if (p.emoji) return `<span class="${size} ${radius} grid place-items-center border hairline bg-white/[.03] ${size.includes('h-16') ? 'text-[34px]' : 'text-[24px]'} leading-none" aria-hidden="true">${p.emoji}</span>`;
  return `<span class="${size} ${radius} grid place-items-center border hairline bg-gradient-to-br from-ink-700 to-ink-900 font-mono text-[13px] tracking-wider text-neon-cyan" dir="ltr">${esc(p.monogram || p.name[0])}</span>`;
}

// an <img> that becomes a labelled empty slot if the file is missing
function shot(src, cap) {
  const slot = `<div class="slot">${icons.image}<span class="text-[12px] text-fog-400">${esc(cap)}</span><code>${esc(src)}</code></div>`;
  return `<img src="${src}" alt="${esc(cap)}" loading="lazy" decoding="async" data-slot="${encodeURIComponent(slot)}" onerror="this.outerHTML=decodeURIComponent(this.dataset.slot)">`;
}

function phoneFrame(item, idx, group) {
  const cap = capOf(item);
  return `<button type="button" class="group block w-[200px] sm:w-[230px] text-start" data-lb="${group}" data-idx="${idx}" aria-label="${esc(cap)}">
      <div class="phone transition-transform duration-500 group-hover:-translate-y-1.5">
        <span class="btn-side"></span>
        <div class="screen">${shot(item.src, cap)}</div>
      </div>
      <p class="mt-4 text-center label">${esc(cap)}</p>
    </button>`;
}
function browserFrame(item, idx, group, url) {
  const cap = capOf(item);
  return `<button type="button" class="group block w-[320px] sm:w-[560px] text-start" data-lb="${group}" data-idx="${idx}" aria-label="${esc(cap)}">
      <div class="browser transition-transform duration-500 group-hover:-translate-y-1.5">
        <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">${esc(url || '')}</span></div>
        <div class="screen">${shot(item.src, cap)}</div>
      </div>
      <p class="mt-4 text-center label">${esc(cap)}</p>
    </button>`;
}

function linkButtons(p) {
  const L = p.links || {};
  const out = [];
  if (L.appStore) out.push(`<a class="btn btn-primary" href="${L.appStore}" target="_blank" rel="noopener">${icons.apple}App Store</a>`);
  if (L.play) out.push(`<a class="btn ${L.appStore ? 'btn-ghost' : 'btn-primary'}" href="${L.play}" target="_blank" rel="noopener">${icons.play}Google Play</a>`);
  if (L.web) out.push(`<a class="btn btn-ghost" href="${L.web}" target="_blank" rel="noopener">${icons.globe}${t('btn.web')}</a>`);
  if (L.github) out.push(`<a class="btn btn-ghost" href="${L.github}" target="_blank" rel="noopener">${icons.github}${t('btn.source')}</a>`);
  if (L.soon) out.push(`<span class="btn btn-disabled">${icons.clock}${esc(L.soon)}</span>`);
  if (L.private) out.push(`<span class="btn btn-disabled">${icons.lock}${esc(L.private)}</span>`);
  return out.join('');
}

            <h3 class="mt-5 text-[24px] sm:text-[30px] font-medium tracking-[-0.02em]">${t('p.restrictedTitle')}</h3>
            <p class="mt-4 max-w-[620px] text-[15.5px] leading-relaxed text-fog-300">${t('p.restricted')}</p>
          </div>
        </div>
      </div>
    </section>`;
  }
  const gallery = S.frame === 'browser'
    ? S.items.map((it, k) => browserFrame(it, k, p.slug, S.url)).join('')
    : S.items.map((it, k) => phoneFrame(it, k, p.slug)).join('');
  const note = (LANG === 'he' && S.noteHe) || S.note;
  return `
    <section class="border-t hairline overflow-hidden">
      <div class="mx-auto max-w-7xl px-4 pt-20 sm:px-8">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <p class="label">${t('p.screens')}</p>
            <h2 class="mt-3 text-[30px] sm:text-[38px] font-medium tracking-[-0.03em]">${t('p.screensTitle')}</h2>
          </div>
          <p class="text-[13px] text-fog-500">${note ? esc(note) + ' · ' : ''}${t('p.scroll')}</p>
        </div>
      </div>
      <div class="mx-auto max-w-7xl px-4 sm:px-8"><div class="rail mt-8">${gallery}</div></div>
    </section>`;
}

function viewVideos(p) {
  if (!p.videos || !p.videos.length) return '';
  return `
    <section class="border-t hairline">
      <div class="mx-auto max-w-7xl px-4 py-20 sm:px-8">
        <p class="label">${t('p.video')}</p>
        <h2 class="mt-3 text-[30px] sm:text-[38px] font-medium tracking-[-0.03em]">${t('p.videoTitle')}</h2>
        <div class="mt-10 grid gap-6 lg:grid-cols-2">
          ${p.videos.map(v => `
            <figure class="video-card reveal">
              <div class="browser relative">
                <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">${esc(v.cap)} · ${esc(v.len)}</span></div>
                <video preload="none" playsinline controls poster="${v.poster}" aria-label="${esc(v.cap)}"><source src="${v.src}" type="video/mp4"></video>
                <button type="button" class="play-cover absolute inset-0 top-[34px] grid place-items-center bg-black/25" aria-label="${esc(v.cap)}">
                  <span class="play-badge grid h-16 w-16 place-items-center rounded-full bg-white/90 text-ink-950 shadow-2xl ps-1">${icons.playBig}</span>
                </button>
              </div>
              <figcaption class="mt-4 flex items-center justify-between label"><span>${esc(v.cap)}</span><span class="ltr">${esc(v.len)}</span></figcaption>
            </figure>`).join('')}
        </div>
      </div>
    </section>`;
}

function viewProject(raw) {
  const p = loc(raw);
  const i = PROJECTS.indexOf(raw);
  const next = loc(PROJECTS[(i + 1) % PROJECTS.length]);

  const meta = [
    [t('p.role'), p.role],
    [t('p.platforms'), p.platforms.join(' · ')],
    [t('p.status'), p.status],
    [t('p.timeline'), p.year],
  ];

  const part = p.contribution ? `
    <div class="mt-6 flex flex-wrap items-center gap-2">
      <span class="label me-2">${t('p.part')}</span>
      ${p.contribution.map(x => `<span class="rounded-full border border-neon-cyan/20 bg-neon-cyan/[.04] px-3 py-1 text-[13px] text-fog-100">${esc(x)}</span>`).join('')}
    </div>` : '';

  const arch = p.architecture.map((l, k) => `
    <div class="layer reveal grid items-start gap-3 sm:grid-cols-12 ${k ? 'mt-4' : ''}">
      <div class="sm:col-span-3 flex items-center gap-3 pt-2">
        <span class="grid h-[30px] w-[30px] shrink-0 place-items-center rounded-full border border-neon-cyan/30 bg-neon-cyan/5 font-mono text-[11px] text-neon-cyan">${k + 1}</span>
        <span class="text-[14.5px] font-medium">${esc(l.name)}</span>
      </div>
      <div class="sm:col-span-9 flex flex-wrap gap-2 rounded-2xl border hairline bg-ink-900/60 p-3">
        ${l.items.map(x => `<span class="rounded-lg bg-white/[.035] px-3 py-1.5 text-[13px] text-fog-300">${esc(x)}</span>`).join('')}
      </div>
    </div>`).join('');

  const challenges = p.challenges.map((c, k) => `
    <div class="glow reveal grid gap-6 rounded-3xl border hairline bg-ink-900/60 p-6 sm:p-8 md:grid-cols-12">
      <div class="md:col-span-5">
        <p class="label">${t('p.problem')} ${String(k + 1).padStart(2, '0')}</p>
        <p class="mt-3 text-[19px] leading-snug tracking-tight">${esc(c.p)}</p>
      </div>
      <div class="md:col-span-7 md:border-s md:border-white/[.07] md:ps-8">
        <p class="label !text-neon-cyan/80">${t('p.approach')}</p>
        <p class="mt-3 text-[15px] leading-relaxed text-fog-300">${esc(c.s)}</p>
      </div>
    </div>`).join('');

  const stack = Object.entries(p.stack).map(([g, items]) => `
    <div class="reveal border-t hairline py-5 grid gap-3 sm:grid-cols-12">
      <span class="label sm:col-span-3 pt-1">${esc(g)}</span>
      <div class="sm:col-span-9 flex flex-wrap gap-2">${items.map(x => `<span class="rounded-full border hairline px-3 py-1 text-[13px] text-fog-300">${esc(x)}</span>`).join('')}</div>
    </div>`).join('');

  return `
  <article>
    <!-- header -->
    <section class="relative overflow-hidden">
      <div class="pointer-events-none absolute inset-0 aurora"></div>
      <div class="pointer-events-none absolute inset-0 gridlines"></div>
      <div class="relative mx-auto max-w-7xl px-4 pb-16 pt-32 sm:px-8 sm:pt-40">
        <a href="#/work" class="inline-flex items-center gap-2 text-[13.5px] text-fog-400 hover:text-white">${icons.back} ${t('p.all')}</a>
        <div class="mt-10 flex flex-wrap items-center gap-4">
          ${projectIcon(p, 'h-16 w-16', 'rounded-[18px]')}
          <span class="rounded-full border border-neon-cyan/25 bg-neon-cyan/[.06] px-3 py-1 chip font-mono text-[11px] uppercase tracking-[.12em] text-neon-cyan">${esc(p.kind)}</span>
        </div>
        <h1 class="mt-8 text-[48px] leading-[0.95] tracking-[-0.045em] font-medium sm:text-[80px] lg:text-[104px]"><bdi>${esc(p.name)}</bdi></h1>
        <p class="mt-6 max-w-[760px] text-[19px] leading-relaxed text-fog-300 sm:text-[22px]">${esc(p.tagline)}</p>
        <div class="mt-10 flex flex-wrap gap-3">${linkButtons(p)}</div>
        ${part}

        <dl class="mt-14 grid gap-px overflow-hidden rounded-3xl border hairline bg-white/[.06] sm:grid-cols-2 lg:grid-cols-4">
          ${meta.map(([k, v]) => `<div class="bg-ink-950 p-6"><dt class="label">${k}</dt><dd class="mt-2 text-[14.5px] leading-snug">${esc(v)}</dd></div>`).join('')}
        </dl>
      </div>
    </section>

    <!-- metrics -->
    <section class="border-t hairline">
      <div class="mx-auto grid max-w-7xl grid-cols-2 lg:grid-cols-4 px-4 sm:px-8">
        ${p.metrics.map((mt, k) => `<div class="reveal py-10 pe-6 ${k % 2 ? 'ps-6 border-s hairline' : ''} ${k >= 2 ? 'border-t lg:border-t-0 hairline' : ''} ${k === 2 ? 'lg:ps-6 lg:border-s' : ''}">
          <p class="text-[30px] sm:text-[40px] font-medium tracking-[-0.04em]"><bdi>${esc(mt.v)}</bdi></p>
          <p class="mt-1 text-[13px] text-fog-400">${esc(mt.k)}</p></div>`).join('')}
      </div>
    </section>

    ${viewVideos(p)}
    ${viewScreens(p)}

    <!-- overview + highlights -->
    <section class="border-t hairline">
      <div class="mx-auto grid max-w-7xl gap-12 px-4 py-20 sm:px-8 sm:py-28 lg:grid-cols-12">
        <div class="lg:col-span-4">
          <p class="reveal label">${t('p.overview')}</p>
          <div class="reveal mt-5 space-y-5 text-[16px] leading-relaxed text-fog-300 lg:sticky lg:top-28">
            ${p.summary.map(x => `<p>${esc(x)}</p>`).join('')}
          </div>
        </div>
        <div class="lg:col-span-8 grid gap-4 sm:grid-cols-2">
          ${p.highlights.map((h, k) => `
            <div class="glow reveal rounded-3xl border hairline bg-ink-900/60 p-7">
              <span class="font-mono text-[11px] text-neon-cyan/80">${String(k + 1).padStart(2, '0')}</span>
              <h3 class="mt-4 text-[18.5px] font-medium tracking-tight">${esc(h.t)}</h3>
              <p class="mt-3 text-[14.5px] leading-relaxed text-fog-400">${esc(h.d)}</p>
            </div>`).join('')}
        </div>
      </div>
    </section>

    ${section('architecture', t('p.arch'), t('p.archTitle'), `<div class="max-w-5xl">${arch}</div>`)}
    ${section('challenges', t('p.eng'), t('p.engTitle'), `<div class="space-y-4">${challenges}</div>`)}
    ${section('stack', t('p.stack'), t('p.stackTitle'), `<div class="border-b hairline">${stack}</div>`)}

    <!-- next -->
    <a href="#/work/${next.slug}" class="group block border-t hairline">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-6 px-4 py-16 sm:px-8 sm:py-24">
        <div>
          <p class="label">${t('p.next')}</p>
          <p class="mt-4 text-[40px] sm:text-[72px] font-medium tracking-[-0.04em] leading-none transition-transform duration-500 group-hover:translate-x-3 rtl:group-hover:-translate-x-3"><bdi>${esc(next.name)}</bdi></p>
          <p class="mt-4 text-[14px] text-fog-400">${esc(next.kind)}</p>
        </div>
        <span class="grid h-16 w-16 shrink-0 place-items-center rounded-full border hairline transition-all duration-500 group-hover:border-neon-cyan/50 group-hover:bg-neon-cyan/10 group-hover:text-neon-cyan">${icons.arrow}</span>
      </div>
    </a>
  </article>`;
}

/* ==========================================================================
   ROUTER
   #/                → home
   #/work | #/expertise | #/about | #/contact → home, scrolled to that section
   #/work/<slug>     → project page
   ========================================================================== */

let currentKey = null;

function parse() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'work' && parts[1]) {
    const p = PROJECTS.find(x => x.slug === parts[1]);
    if (p) return { key: 'p:' + p.slug, project: p };
  }
  return { key: 'home', anchor: parts[0] || null };
}

function render() {
  const r = parse();
  const main = $('#main');
  const same = r.key === currentKey;

  const apply = () => {
    if (!same) {
      main.innerHTML = r.project ? viewProject(r.project) : viewHome();
      document.title = r.project ? `${r.project.name} — ${t('name')}` : t('doc.title');
      currentKey = r.key;
      wire();
    }
    if (r.anchor) {
      const el = document.getElementById(r.anchor);
      if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: same ? 'smooth' : 'auto', block: 'start' }));
    } else if (!same) {
      window.scrollTo(0, 0);
    }
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!same && currentKey !== null && document.startViewTransition && !reduce) {
    document.startViewTransition(apply);
  } else {
    apply();
    if (!same && currentKey !== null) main.firstElementChild?.classList.add('route-in');
  }
}

// static chrome (nav, footer) + document direction
function applyLang() {
  const root = document.documentElement;
  root.lang = LANG;
  root.dir = LANG === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#navName').textContent = t('name');
  $('#skip').textContent = t('skip');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
}

function setLang(next) {
  if (next === LANG || (next === 'he' && !window.HE)) return;
  LANG = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (_) {}
  const y = scrollY;
  const swap = () => { applyLang(); currentKey = null; render(); if (!parse().anchor) scrollTo(0, y); };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (document.startViewTransition && !reduce) document.startViewTransition(swap); else swap();
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

/* ==========================================================================
   INTERACTIONS
   ========================================================================== */

let io;
function wire() {
  // reveal on scroll
  io?.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = `${Math.min(i % 6, 5) * 60}ms`;
    io.observe(el);
  });

  // copy buttons
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); } catch (_) {}
    const span = b.querySelector('span'); const old = span.textContent;
    span.textContent = t('contact.copied'); setTimeout(() => (span.textContent = old), 1600);
  }));

  // lightbox triggers
  document.querySelectorAll('[data-lb]').forEach(b => b.addEventListener('click', () => openLightbox(b.dataset.lb, +b.dataset.idx)));

  // video covers: first tap starts playback, then the native controls take over
  document.querySelectorAll('.play-cover').forEach(c => c.addEventListener('click', () => {
    const v = c.parentElement.querySelector('video');
    document.querySelectorAll('video').forEach(o => o !== v && o.pause());
    c.remove(); v.play().catch(() => {});
  }));

  // hover preview on the work index (pointer devices only)
  const peek = $('#peek');
  peek.classList.remove('on');
  if (matchMedia('(hover: hover)').matches) {
    document.querySelectorAll('[data-peek]').forEach(row => {
      const src = row.dataset.peek;
      if (!src) return;
      const wide = row.dataset.peekFrame === 'browser';
      row.addEventListener('mouseenter', () => {
        peek.innerHTML = wide
          ? `<div class="laptop"><div class="lid"><div class="screen"><img src="${src}" alt=""></div></div><div class="base"></div></div>`
          : `<div class="phone"><div class="screen"><img src="${src}" alt=""></div></div>`;
        peek.classList.toggle('wide', wide);
        peek.classList.add('on');
      });
      row.addEventListener('mouseleave', () => peek.classList.remove('on'));
    });
  }
}

// cursor-tracked glow, delegated once
document.addEventListener('pointermove', e => {
  const peek = $('#peek');
  if (peek.classList.contains('on')) {
    const off = peek.classList.contains('wide') ? 260 : 140;
    peek.style.left = e.clientX + (document.dir === 'rtl' ? -off : off) + 'px';
    peek.style.top = e.clientY + 'px';
  }
  const card = e.target.closest?.('.glow');
  if (!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', `${e.clientX - r.left}px`);
  card.style.setProperty('--my', `${e.clientY - r.top}px`);
}, { passive: true });

// nav gets a surface once the page scrolls
const navInner = $('#navInner');
const onScroll = () => {
  const on = scrollY > 24;
  navInner.classList.toggle('bg-ink-900/70', on);
  navInner.classList.toggle('backdrop-blur-xl', on);
  navInner.classList.toggle('hairline', on);
  navInner.classList.toggle('shadow-2xl', on);
};
addEventListener('scroll', onScroll, { passive: true });

/* lightbox */
const lb = { el: $('#lightbox'), img: $('#lbImg'), cap: $('#lbCap'), list: [], i: 0, last: null };
function lbShow() {
  const it = lb.list[lb.i];
  lb.img.src = it.src; lb.img.alt = capOf(it);
  lb.cap.textContent = `${capOf(it)} · ${lb.i + 1} / ${lb.list.length}`;
}
function openLightbox(slug, i) {
  lb.list = PROJECTS.find(x => x.slug === slug).screens.items; lb.i = i; lb.last = document.activeElement;
  lbShow();
  lb.el.classList.remove('hidden'); lb.el.classList.add('flex');
  document.body.style.overflow = 'hidden';
  $('#lbClose').focus();
}
function closeLightbox() {
  lb.el.classList.add('hidden'); lb.el.classList.remove('flex');
  document.body.style.overflow = '';
  lb.last?.focus();
}
const step = d => { lb.i = (lb.i + d + lb.list.length) % lb.list.length; lbShow(); };
$('#lbClose').onclick = closeLightbox;
$('#lbPrev').onclick = () => step(-1);
$('#lbNext').onclick = () => step(1);
lb.el.addEventListener('click', e => { if (e.target === lb.el) closeLightbox(); });
lb.img.addEventListener('error', () => { lb.cap.textContent = `${t('lb.missing')} ${lb.list[lb.i].src}`; });
addEventListener('keydown', e => {
  if (lb.el.classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

$('#year').textContent = new Date().getFullYear();
addEventListener('hashchange', render);
applyLang();
render();
onScroll();
</script>
</body>
