<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect width="512" height="512" rx="128" fill="url(#bg1)" stroke="#334155" stroke-width="6" />

  <!-- Geometric radar + central node -->
  <g filter="url(#shadow1)">
    <!-- Outer scan arcs -->
    <path d="M140 256 A 116 116 0 0 1 256 140" fill="none" stroke="url(#glow1)" stroke-width="36" stroke-linecap="round"/>
    <path d="M372 256 A 116 116 0 0 1 256 372" fill="none" stroke="url(#glow1)" stroke-width="36" stroke-linecap="round"/>

    <!-- Lead-focus diagonal (arrow vector) -->
    <line x1="170" y1="342" x2="330" y2="182" stroke="url(#glow1)" stroke-width="42" stroke-linecap="round"/>

    <!-- Target node -->
    <circle cx="342" cy="170" r="32" fill="#06b6d4"/>
    <circle cx="342" cy="170" r="14" fill="#ffffff"/>
  </g>
</svg>
